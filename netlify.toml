[build]
  command = "npm run build"
  publish = "dist"
  # Save deploy credits: skip the deploy when a push changes nothing the website uses
  # (tests, notes, the Android project or GitHub workflows). Exit code 0 = skip.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src server shared netlify netlify.toml package.json package-lock.json index.html vite.config.js scripts mobile/www public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "exceljs", "pg", "redis", "@netlify/blobs", "qrcode"]

# Emails, WhatsApp and late-truck checks. Every 10 minutes instead of every minute:
# the minute schedule alone used a large share of the monthly compute credits.
[functions.emails]
  schedule = "*/10 * * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Search engines: the sitemap lists every public route and company page, so it is built live.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/api/seo/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/api/seo/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/driver-api/*"
  to = "/.netlify/functions/api/driver-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Basic browser protections for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# The service worker must always be fresh so updates reach installed copies.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
