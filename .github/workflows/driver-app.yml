# Builds the LogiBridge driver app for Android and publishes the APK at a fixed download link:
# https://github.com/ea99sy-spec/LogiBridge/releases/download/driver-app/logibridge-driver.apk
name: Driver app (Android)

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/driver-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Keep the same signing key between builds so new versions install over old ones.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: logibridge-driver-signing-v1
      - name: Install
        run: npm ci
      - name: Copy the app into the Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace -PversionCode=${{ github.run_number }} 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../logibridge-driver.apk
      # Shows the reason of a failed build as an annotation on the run page.
      - name: Report build error
        if: failure()
        working-directory: mobile/android
        run: |
          msg=$( (sed -n '/What went wrong/,/Try:/p' build.log; grep -E "^e: |error:|Caused by|Exception" build.log | head -15) | head -45 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Android build failed::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: logibridge-driver
          path: mobile/logibridge-driver.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view driver-app >/dev/null 2>&1 || gh release create driver-app \
            --title "LogiBridge Driver (Android)" \
            --notes "تطبيق السائق: تتبع GPS بالخلفية. حمّل ملف logibridge-driver.apk وثبّته على موبايل أندرويد."
          gh release upload driver-app logibridge-driver.apk --clobber
